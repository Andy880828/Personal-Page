name: CI

on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint / 型別 / 格式
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
      - name: 單元測試
        run: npm test
      - name: Build
        run: npm run build
      - name: 大小預算
        run: npm run size
      - name: Bundle 報告
        run: npx vite-bundle-visualizer -o bundle-report.html --open false
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: bundle-report.html
      - name: 安裝 Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: 視覺回歸與互動測試
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      - name: Lighthouse CI
        run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
